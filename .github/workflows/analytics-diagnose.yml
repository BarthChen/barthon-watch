name: 📊 Analytics Diagnostic (READ-ONLY)

# 唯讀診斷工作流程:檢查 analytics_events 集合、daily 文檔和 Cloud Functions 日誌。
# 只能手動觸發(workflow_dispatch),僅執行讀取操作,不修改或刪除任何資料。

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: barthon-watch

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Count analytics_events for 2026-10-22 through 2026-10-26 (Taipei UTC+8)
        run: |
          cat > count-events.js << 'EOF'
          const admin = require('firebase-admin');
          
          // 從環境變數讀取 service account JSON
          const serviceAccount = JSON.parse(process.env.GCP_SA_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: `https://barthon-watch.firebaseio.com`
          });
          
          const db = admin.firestore();
          db.settings({ databaseId: 'barthon' });
          
          async function countEvents() {
            try {
              const eventsRef = db.collection('analytics_events');
              
              // 先取得整個集合的總數量(使用 count aggregation)
              console.log('=== Total Collection Stats ===');
              const countSnapshot = await eventsRef.count().get();
              console.log(`Total documents in analytics_events: ${countSnapshot.data().count}`);
              
              // 取得最新 10 筆事件的 timestamp
              console.log('\n=== Newest 10 event timestamps ===');
              const newestEvents = await eventsRef
                .orderBy('timestamp', 'desc')
                .limit(10)
                .get();
              
              if (newestEvents.empty) {
                console.log('  No events with timestamp field found');
              } else {
                newestEvents.forEach((doc, idx) => {
                  const data = doc.data();
                  const ts = data.timestamp;
                  if (ts && ts.toDate) {
                    console.log(`  ${idx + 1}. ${ts.toDate().toISOString()}`);
                  } else if (ts) {
                    console.log(`  ${idx + 1}. ${ts}`);
                  } else {
                    console.log(`  ${idx + 1}. (no timestamp)`);
                  }
                });
              }
              
              // 計算 PR #17 部署後的事件數量 (2026-10-25T09:41:00Z 之後)
              console.log('\n=== Events after PR #17 deploy (2026-10-25T09:41:00Z) ===');
              const pr17Timestamp = new Date('2026-10-25T09:41:00Z');
              const afterPR17 = await eventsRef
                .where('timestamp', '>', pr17Timestamp)
                .count()
                .get();
              console.log(`Total events after 2026-10-25T09:41:00Z: ${afterPR17.data().count}`);
              
              // 定義 Taipei UTC+8 日期範圍 (2026-10-22 至 2026-10-26)
              const days = [
                { name: '2026-10-22', start: new Date('2026-10-21T16:00:00Z'), end: new Date('2026-10-22T15:59:59.999Z') },
                { name: '2026-10-23', start: new Date('2026-10-22T16:00:00Z'), end: new Date('2026-10-23T15:59:59.999Z') },
                { name: '2026-10-24', start: new Date('2026-10-23T16:00:00Z'), end: new Date('2026-10-24T15:59:59.999Z') },
                { name: '2026-10-25', start: new Date('2026-10-24T16:00:00Z'), end: new Date('2026-10-25T15:59:59.999Z') },
                { name: '2026-10-26', start: new Date('2026-10-25T16:00:00Z'), end: new Date('2026-10-26T15:59:59.999Z') }
              ];
              
              for (const day of days) {
                console.log(`\n=== ${day.name} (Taipei UTC+8) ===`);
                const snapshot = await eventsRef
                  .where('timestamp', '>=', day.start)
                  .where('timestamp', '<=', day.end)
                  .get();
                
                console.log(`Total events: ${snapshot.size}`);
                
                if (snapshot.size > 0) {
                  // 按 type 分組統計
                  const typeCount = {};
                  snapshot.forEach(doc => {
                    const type = doc.data().type || 'unknown';
                    typeCount[type] = (typeCount[type] || 0) + 1;
                  });
                  
                  console.log('Breakdown by type:');
                  Object.entries(typeCount).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
                    console.log(`  ${type}: ${count}`);
                  });
                }
              }
              
              process.exit(0);
            } catch (error) {
              console.error('Error counting events:', error.message);
              if (error.code === 7) {
                console.error('⚠️  Permission denied. Required IAM role: roles/datastore.user or roles/owner');
              }
              process.exit(0); // 繼續執行其他步驟
            }
          }
          
          countEvents();
          EOF
          
          node count-events.js
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Read analytics_daily documents (2026-10-22 through 2026-10-26)
        run: |
          cat > read-daily.js << 'EOF'
          const admin = require('firebase-admin');
          
          const serviceAccount = JSON.parse(process.env.GCP_SA_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });
          
          const db = admin.firestore();
          db.settings({ databaseId: 'barthon' });
          
          async function readDaily() {
            const dates = ['2026-10-22', '2026-10-23', '2026-10-24', '2026-10-25', '2026-10-26'];
            
            for (const date of dates) {
              try {
                console.log(`\n=== analytics_daily/${date} ===`);
                const dailyDoc = await db.collection('analytics_daily').doc(date).get();
                
                if (dailyDoc.exists) {
                  console.log(JSON.stringify(dailyDoc.data(), null, 2));
                } else {
                  console.log('Document does not exist');
                }
              } catch (error) {
                console.error(`Error reading analytics_daily/${date}:`, error.message);
                if (error.code === 7) {
                  console.error('⚠️  Permission denied. Required IAM role: roles/datastore.user or roles/owner');
                }
              }
            }
            
            process.exit(0);
          }
          
          readDaily();
          EOF
          
          node read-daily.js
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Read stats documents (2026-10-22 through 2026-10-26)
        run: |
          cat > read-stats.js << 'EOF'
          const admin = require('firebase-admin');
          
          const serviceAccount = JSON.parse(process.env.GCP_SA_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });
          
          const db = admin.firestore();
          db.settings({ databaseId: 'barthon' });
          
          async function readStats() {
            const dates = ['2026-10-22', '2026-10-23', '2026-10-24', '2026-10-25', '2026-10-26'];
            
            for (const date of dates) {
              try {
                console.log(`\n=== stats/${date} ===`);
                const statsDoc = await db.collection('stats').doc(date).get();
                
                if (statsDoc.exists) {
                  console.log(JSON.stringify(statsDoc.data(), null, 2));
                } else {
                  console.log('Document does not exist');
                }
              } catch (error) {
                console.error(`Error reading stats/${date}:`, error.message);
                if (error.code === 7) {
                  console.error('⚠️  Permission denied. Required IAM role: roles/datastore.user or roles/owner');
                }
              }
            }
            
            process.exit(0);
          }
          
          readStats();
          EOF
          
          node read-stats.js
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Read Cloud Functions aggregation logs (nightly runs for 2026-10-22 through 2026-10-26)
        run: |
          echo "=== Aggregation logs for Taipei days 2026-10-22 through 2026-10-26 ==="
          echo ""
          
          # 每日彙總函式在 UTC 23:00-00:30 執行 (Taipei 隔天早上 07:00-08:30)
          # 檢查 2026-10-22 至 2026-10-26 的 Taipei 日期對應的夜間執行窗口
          
          WINDOWS=(
            "2026-10-22:2026-10-21T23:00:00Z:2026-10-22T00:30:00Z"
            "2026-10-23:2026-10-22T23:00:00Z:2026-10-23T00:30:00Z"
            "2026-10-24:2026-10-23T23:00:00Z:2026-10-24T00:30:00Z"
            "2026-10-25:2026-10-24T23:00:00Z:2026-10-25T00:30:00Z"
            "2026-10-26:2026-10-25T23:00:00Z:2026-10-26T00:30:00Z"
          )
          
          for window in "${WINDOWS[@]}"; do
            IFS=':' read -r date start_time end_time <<< "$window"
            echo "--- Aggregation run for Taipei day $date ($start_time to $end_time) ---"
            gcloud logging read \
              "(resource.type=\"cloud_function\" OR resource.type=\"cloud_run_revision\") AND timestamp>=\"$start_time\" AND timestamp<=\"$end_time\"" \
              --limit=100 \
              --format=json \
              --project=barthon-watch \
              2>&1 || echo "⚠️  gcloud logging read failed for $date window"
            echo ""
          done

      - name: Read Firestore permission-denied and error logs (since 2026-10-25T09:00:00Z)
        run: |
          echo "=== Firestore permission-denied / error logs since 2026-10-25T09:00:00Z ==="
          gcloud logging read \
            'protoPayload.status.message=~"PERMISSION_DENIED" OR severity>=ERROR AND timestamp>="2026-10-25T09:00:00Z"' \
            --limit=200 \
            --format=json \
            --project=barthon-watch \
            2>&1 || echo "⚠️  gcloud logging read failed. Required IAM role: roles/logging.viewer or roles/logging.admin"
