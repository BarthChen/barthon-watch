name: 📊 Analytics Diagnostic (READ-ONLY)

# 唯讀診斷工作流程:檢查 analytics_events 集合、daily 文檔和 Cloud Functions 日誌。
# 只能手動觸發(workflow_dispatch),僅執行讀取操作,不修改或刪除任何資料。

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: barthon-watch
          export_default_credentials: true

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Count analytics_events for 2026-10-20 and 2026-10-21 (Taipei UTC+8)
        run: |
          cat > count-events.js << 'EOF'
          const admin = require('firebase-admin');
          
          // 從環境變數讀取 service account JSON
          const serviceAccount = JSON.parse(process.env.GCP_SA_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: `https://barthon-watch.firebaseio.com`
          });
          
          const db = admin.firestore();
          db.settings({ databaseId: 'barthon' });
          
          async function countEvents() {
            try {
              // 2026-10-20 00:00:00 到 23:59:59 (Taipei UTC+8)
              // UTC: 2026-10-19 16:00:00 到 2026-10-20 15:59:59
              const day20Start = new Date('2026-10-19T16:00:00Z');
              const day20End = new Date('2026-10-20T15:59:59.999Z');
              
              // 2026-10-21 00:00:00 到 23:59:59 (Taipei UTC+8)
              // UTC: 2026-10-20 16:00:00 到 2026-10-21 15:59:59
              const day21Start = new Date('2026-10-20T16:00:00Z');
              const day21End = new Date('2026-10-21T15:59:59.999Z');
              
              console.log('=== 2026-10-20 (Taipei UTC+8) ===');
              const snapshot20 = await db.collection('analytics_events')
                .where('timestamp', '>=', day20Start)
                .where('timestamp', '<=', day20End)
                .get();
              
              console.log(`Total events: ${snapshot20.size}`);
              
              // 按 type 分組統計
              const typeCount20 = {};
              snapshot20.forEach(doc => {
                const type = doc.data().type || 'unknown';
                typeCount20[type] = (typeCount20[type] || 0) + 1;
              });
              
              console.log('Breakdown by type:');
              Object.entries(typeCount20).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
                console.log(`  ${type}: ${count}`);
              });
              
              console.log('\n=== 2026-10-21 (Taipei UTC+8) ===');
              const snapshot21 = await db.collection('analytics_events')
                .where('timestamp', '>=', day21Start)
                .where('timestamp', '<=', day21End)
                .get();
              
              console.log(`Total events: ${snapshot21.size}`);
              
              // 按 type 分組統計
              const typeCount21 = {};
              snapshot21.forEach(doc => {
                const type = doc.data().type || 'unknown';
                typeCount21[type] = (typeCount21[type] || 0) + 1;
              });
              
              console.log('Breakdown by type:');
              Object.entries(typeCount21).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
                console.log(`  ${type}: ${count}`);
              });
              
              process.exit(0);
            } catch (error) {
              console.error('Error counting events:', error.message);
              if (error.code === 7) {
                console.error('⚠️  Permission denied. Required IAM role: roles/datastore.user or roles/owner');
              }
              process.exit(0); // 繼續執行其他步驟
            }
          }
          
          countEvents();
          EOF
          
          node count-events.js
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Read analytics_daily/2026-10-21 document
        run: |
          cat > read-daily.js << 'EOF'
          const admin = require('firebase-admin');
          
          const serviceAccount = JSON.parse(process.env.GCP_SA_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });
          
          const db = admin.firestore();
          db.settings({ databaseId: 'barthon' });
          
          async function readDaily() {
            try {
              console.log('=== analytics_daily/2026-10-21 ===');
              const dailyDoc = await db.collection('analytics_daily').doc('2026-10-21').get();
              
              if (dailyDoc.exists) {
                console.log(JSON.stringify(dailyDoc.data(), null, 2));
              } else {
                console.log('Document does not exist');
              }
              
              process.exit(0);
            } catch (error) {
              console.error('Error reading analytics_daily:', error.message);
              if (error.code === 7) {
                console.error('⚠️  Permission denied. Required IAM role: roles/datastore.user or roles/owner');
              }
              process.exit(0);
            }
          }
          
          readDaily();
          EOF
          
          node read-daily.js
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Read stats/2026-10-21 document
        run: |
          cat > read-stats.js << 'EOF'
          const admin = require('firebase-admin');
          
          const serviceAccount = JSON.parse(process.env.GCP_SA_KEY);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });
          
          const db = admin.firestore();
          db.settings({ databaseId: 'barthon' });
          
          async function readStats() {
            try {
              console.log('=== stats/2026-10-21 ===');
              const statsDoc = await db.collection('stats').doc('2026-10-21').get();
              
              if (statsDoc.exists) {
                console.log(JSON.stringify(statsDoc.data(), null, 2));
              } else {
                console.log('Document does not exist');
              }
              
              process.exit(0);
            } catch (error) {
              console.error('Error reading stats:', error.message);
              if (error.code === 7) {
                console.error('⚠️  Permission denied. Required IAM role: roles/datastore.user or roles/owner');
              }
              process.exit(0);
            }
          }
          
          readStats();
          EOF
          
          node read-stats.js
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Read Cloud Functions logs (2026-10-21 23:00 to 2026-10-22 00:30 UTC)
        run: |
          echo "=== Cloud Functions logs between 2026-10-21T23:00:00Z and 2026-10-22T00:30:00Z ==="
          gcloud logging read \
            'resource.type="cloud_function" AND timestamp>="2026-10-21T23:00:00Z" AND timestamp<="2026-10-22T00:30:00Z"' \
            --limit=200 \
            --format=json \
            --project=barthon-watch \
            2>&1 || {
              EXIT_CODE=$?
              echo "⚠️  gcloud logging read failed with exit code $EXIT_CODE"
              echo "Required IAM role: roles/logging.viewer or roles/logging.admin"
              exit 0
            }
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
