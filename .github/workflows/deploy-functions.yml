name: 🔥 Deploy Cloud Functions

# 自動部署:push 到 main 且 functions/** 或 firebase.json 有變動時觸發。
# 也保留手動觸發功能(workflow_dispatch)。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json']
jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: w9jds/firebase-action@v13.20.1
        with:
          args: deploy --only functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: barthon-watch
